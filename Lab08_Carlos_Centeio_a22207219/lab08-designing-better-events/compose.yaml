name: lab08-designing-better-events
services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: lab08-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks: [store-network]
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: store
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka: {condition: service_healthy}
    networks: [store-network]
  supplier-db:
    image: postgres:18
    environment:
      POSTGRES_DB: supplierdb
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepass
    ports: ["5433:5432"]
    volumes: ["supplier-db-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d supplierdb"]
      interval: 5s
      retries: 20
    networks: [store-network]
  product-db:
    image: postgres:18
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepass
    ports: ["5434:5432"]
    volumes: ["product-db-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d productdb"]
      interval: 5s
      retries: 20
    networks: [store-network]
  supplier-service:
    build: ./supplier-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://supplier-db:5432/supplierdb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8082:8082"]
    depends_on:
      supplier-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [store-network]
  product-service:
    build: ./product-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/productdb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8081:8081"]
    depends_on:
      product-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [store-network]
volumes:
  kafka-data:
    name: store-labs-kafka-data
  supplier-db-data:
    name: store-labs-supplier-db-data
  product-db-data:
    name: store-labs-product-db-data
networks:
  store-network:
    name: store-network
    external: true
